<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">IBM strategic foresight and scenario planning</title>
<desc id="desc">A dark blue technology-themed scenario matrix with four possible futures and a glowing network motif.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07162c"/><stop offset=".55" stop-color="#102e55"/><stop offset="1" stop-color="#07101f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#3d9ce5" stop-opacity=".5"/><stop offset="1" stop-color="#3d9ce5" stop-opacity="0"/></radialGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#79c9ff"/><stop offset="1" stop-color="#d7c18a"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<circle cx="900" cy="150" r="320" fill="url(#glow)"/>
<g opacity=".18" stroke="#83bde8" fill="none"><path d="M0 130H1200M0 250H1200M0 370H1200M0 490H1200M0 610H1200M140 0V700M300 0V700M460 0V700M620 0V700M780 0V700M940 0V700M1100 0V700"/><path d="M0 700L700 0M250 700L950 0M500 700L1200 0"/></g>
<rect x="34" y="34" width="1132" height="632" rx="22" fill="none" stroke="#b49a66" stroke-width="3"/>
<rect x="48" y="48" width="1104" height="604" rx="16" fill="none" stroke="#526b85" stroke-width="1.5"/>
<g font-family="Georgia,serif" fill="#e8d9b5">
 <text x="82" y="118" font-size="25" letter-spacing="8" fill="#9dbbd2">STRATEGIC FORESIGHT / 2026—2046</text>
 <text x="80" y="190" font-size="72" font-weight="bold">IBM</text>
 <text x="82" y="232" font-size="27" letter-spacing="4">SCENARIO PLANNING</text>
</g>
<g transform="translate(610 145)">
 <rect x="0" y="0" width="470" height="390" rx="10" fill="#08182c" fill-opacity=".72" stroke="#86b6d6" stroke-width="2"/>
 <path d="M235 0V390M0 195H470" stroke="url(#line)" stroke-width="3"/>
 <g fill="#d7e7f3" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">
  <text x="117" y="52" font-size="15" fill="#a9c5db">COOPERATION</text>
  <text x="352" y="52" font-size="15" fill="#a9c5db">FRAGMENTATION</text>
  <text x="117" y="106">Connected</text><text x="117" y="132">Incremental</text><text x="117" y="158">Progress</text>
  <text x="352" y="106">Fragmented</text><text x="352" y="132">Computing</text><text x="352" y="158">World</text>
  <text x="117" y="246">Cooperative</text><text x="117" y="272">Quantum</text><text x="117" y="298">Renaissance</text>
  <text x="352" y="246">The Quantum</text><text x="352" y="272">Cold War</text>
 </g>
 <g fill="#78c6ff"><circle cx="117" cy="195" r="5"/><circle cx="352" cy="195" r="5"/><circle cx="117" cy="390" r="5"/><circle cx="352" cy="390" r="5"/></g>
 <g stroke="#7bbbe7" stroke-width="1.5" fill="none" opacity=".8"><path d="M20 370L110 330L160 350L235 300L320 320L450 260"/><path d="M25 20L80 75L130 30L235 90L340 30L445 80"/></g>
</g>
